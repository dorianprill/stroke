[package]
name = "stroke"
version = "0.4.1"
description = """Zero-allocation Bézier and B-spline curves in a compile-time number of dimensions."""
authors = ["Dorian Prill"]
repository = "https://github.com/dorianprill/stroke"
readme = "README.md"
keywords = ["point", "bezier", "spline", "graphics", "path"]
categories = ["no-std", "science", "graphics", "mathematics", "data-structures"]
edition = "2024"
rust-version = "1.95"
license = "MIT"


include = [
    "Cargo.toml",
    "clippy.toml",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
    "rust-toolchain",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/*.rs",
]

[dependencies]
tinyvec = { version = "^1.10.0" }
nalgebra = { version = "^0.34.1", default-features = false, features = [
    "libm",
], optional = true }


[dependencies.num-traits]
version = "^0.2"
default-features = false
features = ["libm"]      # use `Float` and `Real` without `std`

[features]
nalgebra = ["dep:nalgebra"]

# Used by tests and examples.
[dev-dependencies]
kuva = { version = "0.6", default-features = false }

[lints.rust]
# Apply the library's existing safety policy to examples and tests as well.
unsafe_code = "forbid"

[lints.clippy]
# Keep individual lint overrides more specific than these groups.
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Catch debug leftovers and unfinished implementations before they ship.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"

# Prefer portable core/alloc APIs and avoid unnecessary copies.
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
redundant_clone = "warn"
doc_markdown = "warn"

# Transitive dependencies can require different versions of the same crate.
multiple_crate_versions = "allow"
# Enable extra lints individually. The numerical code uses exact knot
# comparisons, scalar casts, indexed arrays and short mathematical names.
