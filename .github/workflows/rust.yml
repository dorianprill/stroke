name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      # generic_const_exprs requires the compatible trait solver on nightly.
      RUSTFLAGS: -Znext-solver=coherence
      RUSTDOCFLAGS: -Znext-solver=coherence

    steps:
    - uses: actions/checkout@v4
    - name: UpdateNightly
      run: rustup default nightly
    - name: Install rustfmt and Clippy
      run: rustup component add rustfmt clippy
    - name: Format
      run: cargo fmt -- --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Build examples
      run: cargo build --examples --verbose
    - name: Render curve examples
      run: cargo run --example kuva_curves
    - name: Build docs
      run: cargo doc --no-deps --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run tests (nalgebra)
      run: cargo test --features nalgebra --verbose
