name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: UpdateNightly
      run: rustup default nightly
    - name: Install rustfmt and Clippy
      run: rustup component add rustfmt clippy
    - name: Format
      run: |
        cargo fmt -- --check
        cargo fmt --manifest-path tests/downstream/Cargo.toml -- --check
    - name: Clippy (no default features)
      run: cargo lint-default
    - name: Clippy (all features)
      run: cargo lint
    - name: Build
      run: cargo build --verbose
    - name: Build examples
      run: cargo build --examples --verbose
    - name: Verify release package
      run: cargo package --locked
    - name: Render curve examples
      run: |
        cargo run --example kuva_curves
        cargo run --example kuva_basis
    - name: Build docs
      run: cargo rustdoc --all-features --lib -- -D warnings
    - name: Run tests
      run: cargo test --verbose
    - name: Run tests (nalgebra)
      run: cargo test --features nalgebra --verbose
    - name: Test example assertions
      run: cargo test --examples --all-features
    - name: Run domain examples
      run: |
        cargo run --example bspline_signal_1d
        cargo run --example motion_3d
        cargo run --example spatial_queries
        cargo run --example animation_envelope
    - name: Downstream consumer without repository configuration
      shell: bash
      run: |
        repo_dir="$PWD"
        consumer_dir="$(mktemp -d)"
        cd "$consumer_dir"
        cargo +nightly run --manifest-path "$repo_dir/tests/downstream/Cargo.toml" --no-default-features
        cargo +nightly run --manifest-path "$repo_dir/tests/downstream/Cargo.toml" --all-features

  portability:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wasm32-unknown-unknown, thumbv7em-none-eabihf]
    steps:
    - uses: actions/checkout@v4
    - name: Install nightly target
      run: |
        rustup toolchain install nightly --profile minimal
        rustup target add --toolchain nightly ${{ matrix.target }}
    - name: Check no-std library
      run: cargo +nightly check --lib --no-default-features --target ${{ matrix.target }}
    - name: Check nalgebra adapter without std
      run: cargo +nightly check --lib --all-features --target ${{ matrix.target }}
