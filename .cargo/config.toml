[alias]
lint = "clippy --all-targets --all-features -- -D warnings"
lint-default = "clippy --all-targets --no-default-features -- -D warnings"

[build]
# Use the trait solver compatible with generic_const_exprs for builds,
# Clippy, doctests and rustdoc.
rustflags = ["-Znext-solver=coherence"]
rustdocflags = ["-Znext-solver=coherence"]
